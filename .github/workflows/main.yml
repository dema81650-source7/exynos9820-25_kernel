name: Build Cruel Kernel Note10Plus Ultimate

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        model: [ "N975F" ]

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          # Instructions: Ensure full history is fetched to satisfy the script's git commands
          fetch-depth: 0
          ref: cruel

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libncurses-dev bc bison flex libssl-dev libelf-dev android-tools-adb git python3 curl wget unzip re2c

      - name: Prepare Magisk and Patch Script
        # This step solves the IndexError by manually forcing the branch name into the script
        run: |
          mkdir -p usr/magisk
          curl -L https://github.com/topjohnwu/Magisk/releases/download/v26.1/Magisk-v26.1.apk -o usr/magisk/Magisk.zip
          echo "26.1" > usr/magisk/magisk_version
          
          # Patching the specific line that causes IndexError (Line 585/1189 in your screenshots)
          sed -i "s/branch = run(\['git', 'submodule', 'foreach', 'git', 'rev-parse', '--abbrev-ref', 'HEAD'\]).splitlines()\[1\]/branch = 'cruel'/g" cruelbuild
          
          chmod +x cruelbuild
          echo "Script patched and Magisk ready."

      - name: Kernel Configure
        run: |
          ./cruelbuild config \
                       model=${{ matrix.model }} \
                       name="Cruel-Hunter-Elite-120FPS" \
                       +magisk \
                       +wireguard \
                       +ttl \
                       +nohardening \
                       +nodebug \
                       +ntfs \
                       +sdfat \
                       +cifs \
                       +morosound \
                       +boeffla_wl_blocker \
                       +force_dex_wqhd \
                       +usb_serial \
                       +empty_vbmeta \
                       +performance \
                       +simple_lmk \
                       +tcp_bbr \
                       +tcp_westwood \
                       +io_zen \
                       +fp_boost \
                       +1000hz

      - name: Build Kernel Image
        run: |
          ./cruelbuild mkimg model=${{ matrix.model }}

      - name: Upload Kernel Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Cruel-Kernel-${{ matrix.model }}
          path: out/*.zip
