name: Build Cruel Kernel Note10+ Ultimate

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3
        with:
          ref: cruel
          fetch-depth: 0

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libncurses-dev bc bison flex libssl-dev libelf-dev android-tools-adb git python3 curl wget unzip re2c

      - name: Configure Git Identity
        run: |
          git config --global user.email "bot@github.com"
          git config --global user.name "GitHub-Actions"

      - name: Ultimate Surgical Patch
        run: |
          # This Python script injects the missing 'version' and fixes syntax errors
          python3 -c "
          import sys
          import re
          
          try:
              with open('cruelbuild', 'r') as f:
                  lines = f.readlines()
              
              new_lines = []
              # Inject 'version' definition at the very top to prevent NameError
              new_lines.append(\"version = '26.1'\\n\")
              
              skip_git_logic = False
              for line in lines:
                  # 1. Fix Branch Detection with correct indentation
                  if 'branch = run([' in line:
                      indent = line[:line.find('branch')]
                      new_lines.append(f'{indent}branch = \"cruel\"\\n')
                      skip_git_logic = True
                      continue
                  
                  if skip_git_logic:
                      if 'splitlines()[1]' in line:
                          skip_git_logic = False
                      continue

                  # 2. Disable Magisk function calls
                  if 'update_magisk(' in line:
                      new_lines.append(line.replace('update_magisk(', '# update_magisk('))
                      continue
                  
                  new_lines.append(line)
              
              with open('cruelbuild', 'w') as f:
                  f.writelines(new_lines)
              print('Applied Ultimate Patch: Version fixed, Git fixed, Magisk disabled.')
          except Exception as e:
              print(f'Critical Patch Error: {e}')
              sys.exit(1)
          "

      - name: Configure and Build Kernel
        run: |
          chmod +x cruelbuild
          mkdir -p out
          
          # Running the config with no Magisk dependency
          ./cruelbuild config \
            model=N975F \
            toolchain=proton \
            name="Cruel-Hunter-Elite-120FPS" \
            +wireguard \
            +ttl \
            +nohardening \
            +nodebug \
            +ntfs \
            +sdfat \
            +cifs \
            +morosound \
            +boeffla_wl_blocker \
            +force_dex_wqhd \
            +usb_serial \
            +empty_vbmeta \
            +performance \
            +simple_lmk \
            +tcp_bbr \
            +tcp_westwood \
            +io_zen \
            +fp_boost \
            +1000hz
          
          ./cruelbuild mkimg model=N975F

      - name: Upload Finished Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Cruel-Kernel-Note10Plus-Fixed
          path: out/*.zip
