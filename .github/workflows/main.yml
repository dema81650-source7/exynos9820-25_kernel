name: Build Cruel Kernel Note10Plus Ultimate

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Based on developer instructions: Setting the model for Note10+
        model: [ "N975F" ]

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          ref: cruel
          fetch-depth: 0

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libncurses-dev bc bison flex libssl-dev libelf-dev android-tools-adb git python3 curl wget unzip re2c

      - name: Setup Magisk Requirement
        # The developer mentions +magisk, so we ensure the directory exists
        run: |
          mkdir -p usr/magisk
          echo "26.1" > usr/magisk/magisk_version
          touch usr/magisk/update_magisk.sh
          chmod +x usr/magisk/update_magisk.sh

      - name: Kernel Configure
        # This section is copied and optimized from the developer's guide you provided
        run: |
          chmod +x cruelbuild
          ./cruelbuild config \
                       model=${{ matrix.model }} \
                       name="Cruel-Hunter-Elite-120FPS" \
                       +magisk \
                       +wireguard \
                       +ttl \
                       +nohardening \
                       +nodebug \
                       +ntfs \
                       +sdfat \
                       +cifs \
                       +morosound \
                       +boeffla_wl_blocker \
                       +force_dex_wqhd \
                       +usb_serial \
                       +empty_vbmeta \
                       +performance \
                       +simple_lmk \
                       +tcp_bbr \
                       +tcp_westwood \
                       +io_zen \
                       +fp_boost \
                       +1000hz

      - name: Build Kernel Image
        run: |
          ./cruelbuild mkimg model=${{ matrix.model }}

      - name: Upload Kernel Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Cruel-Kernel-${{ matrix.model }}
          path: out/*.zip
