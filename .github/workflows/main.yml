name: Build Cruel Kernel Note10Plus

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    # Exactly as the developer instructed
    strategy:
      matrix:
        model: [ "N975F" ]

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          # Important: fetch-depth 0 is required for the script's git logic
          fetch-depth: 0
          submodules: recursive

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libncurses-dev bc bison flex libssl-dev libelf-dev android-tools-adb git python3 curl wget unzip re2c

      - name: Create Developer Environment
        # This step creates the files the developer's script expects to find
        run: |
          mkdir -p usr/magisk
          curl -L https://github.com/topjohnwu/Magisk/releases/download/v26.1/Magisk-v26.1.apk -o usr/magisk/Magisk.zip
          echo "26.1" > usr/magisk/magisk_version
          
          # Fix line 585 IndexError: bypass git branch detection
          sed -i "s/branch = run(\['git', 'submodule'.*splitlines()\[1\]/branch = 'cruel'/g" cruelbuild
          
          chmod +x cruelbuild

      - name: Kernel Configure
        # This section is copied EXACTLY from the developer's instructions you provided
        run: |
          ./cruelbuild config                    \
                       model=${{ matrix.model }} \
                       name="Cruel-Hunter-Elite" \
                       +magisk                   \
                       +nohardening              \
                       +ttl                      \
                       +wireguard                \
                       +cifs                     \
                       +sdfat                    \
                       +ntfs                     \
                       +morosound                \
                       +boeffla_wl_blocker       \
                       +nodebug                  \
                       +performance              \
                       +1000hz

      - name: Build Kernel Image
        run: |
          ./cruelbuild mkimg model=${{ matrix.model }}

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Cruel-Kernel-${{ matrix.model }}
          path: out/*.zip
