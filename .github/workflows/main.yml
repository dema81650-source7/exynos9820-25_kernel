name: Build Cruel Kernel Note10+ Ultimate

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          ref: cruel
          fetch-depth: 0

      - name: Setup Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libncurses-dev bc bison flex libssl-dev libelf-dev android-tools-adb git python3 curl wget unzip

      - name: Smart Patch for CruelBuild
        run: |
          # Use Python to surgically remove the multi-line branch check
          python3 -c "
          import sys
          lines = []
          skip_mode = False
          
          try:
              with open('cruelbuild', 'r') as f:
                  for line in f:
                      # 1. Detect the start of the problematic branch check
                      if 'branch = run([' in line:
                          skip_mode = True
                          # Inject the fixed branch name
                          lines.append('    branch = \"cruel\"\n')
                      
                      # 2. While in skip mode, look for the end of the multi-line command
                      if skip_mode:
                          if 'splitlines()[1]' in line:
                              skip_mode = False
                          continue
                      
                      # 3. Keep all other lines as is
                      lines.append(line)
              
              # Write the patched script
              with open('cruelbuild', 'w') as f:
                  f.writelines(lines)
              print('Successfully patched multi-line error in cruelbuild!')
              
          except Exception as e:
              print(f'Error patching file: {e}')
              sys.exit(1)
          "

      - name: Fix Magisk Dependency
        run: |
          mkdir -p usr/magisk/
          echo "#!/bin/sh" > usr/magisk/update_magisk.sh
          echo "exit 0" >> usr/magisk/update_magisk.sh
          chmod +x usr/magisk/update_magisk.sh

      - name: Configure and Build
        run: |
          chmod +x cruelbuild
          
          ./cruelbuild config \
            model=N975F \
            toolchain=proton \
            name="Cruel-Hunter-Elite-120FPS" \
            +wireguard \
            +ttl \
            +nohardening \
            +nodebug \
            +ntfs \
            +sdfat \
            +cifs \
            +morosound \
            +boeffla_wl_blocker \
            +force_dex_wqhd \
            +usb_serial \
            +empty_vbmeta \
            +performance \
            +simple_lmk \
            +tcp_bbr \
            +tcp_westwood \
            +io_zen \
            +fp_boost \
            +1000hz
          
          ./cruelbuild mkimg model=N975F

      - name: Upload Kernel
        uses: actions/upload-artifact@v4
        with:
          name: Cruel-Kernel-Note10Plus
          path: out/*.zip
