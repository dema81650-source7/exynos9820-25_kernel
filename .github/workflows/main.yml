name: Build Cruel Kernel Note10+ Ultimate

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3
        with:
          ref: cruel
          fetch-depth: 0

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libncurses-dev bc bison flex libssl-dev libelf-dev android-tools-adb git python3 curl wget unzip re2c

      - name: Configure Git Identity
        run: |
          git config --global user.email "bot@github.com"
          git config --global user.name "GitHub-Actions"

      - name: Deep Source Code Repair (Safe Injection)
        run: |
          python3 -c "
          import sys
          import re

          try:
              with open('cruelbuild', 'r') as f:
                  lines = f.readlines()

              new_lines = []
              # Inject global variables at the top after imports
              injected = False
              for line in lines:
                  new_lines.append(line)
                  if 'import os' in line and not injected:
                      new_lines.append('version = \"26.1\"\n')
                      new_lines.append('branch = \"cruel\"\n')
                      injected = True

              content = ''.join(new_lines)

              # 1. Fix Git Branch Detection: Replace the failing run() logic with hardcoded branch
              content = re.sub(r'branch\s*=\s*run\(\[.*?splitlines\(\)\[1\]', 'branch = \"cruel\"', content, flags=re.DOTALL)

              # 2. Fix Magisk Function: Make it do nothing (pass) instead of commenting it out
              # This prevents SyntaxError: invalid syntax
              content = re.sub(r'def\s+update_magisk\(.*?\):.*?run\(cmd', 'def update_magisk(version):\n    pass\n    # run(cmd', content, flags=re.DOTALL)

              with open('cruelbuild', 'w') as f:
                  f.write(content)
              print('Deep repair completed successfully.')
          except Exception as e:
              print(f'Critical Repair Error: {e}')
              sys.exit(1)
          "

      - name: Configure and Build Kernel
        run: |
          mkdir -p out
          # Execute with Python3 directly for maximum stability
          python3 cruelbuild config \
            model=N975F \
            toolchain=proton \
            name="Cruel-Hunter-Elite-120FPS" \
            +wireguard \
            +ttl \
            +nohardening \
            +nodebug \
            +ntfs \
            +sdfat \
            +cifs \
            +morosound \
            +boeffla_wl_blocker \
            +force_dex_wqhd \
            +usb_serial \
            +empty_vbmeta \
            +performance \
            +simple_lmk \
            +tcp_bbr \
            +tcp_westwood \
            +io_zen \
            +fp_boost \
            +1000hz
          
          python3 cruelbuild mkimg model=N975F

      - name: Upload Finished Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Cruel-Kernel-Note10Plus-Ultimate
          path: out/*.zip
