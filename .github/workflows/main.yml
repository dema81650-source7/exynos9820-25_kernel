name: Build Cruel Kernel Note10Plus

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          ref: cruel
          fetch-depth: 0

      - name: Install Build Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libncurses-dev bc bison flex libssl-dev libelf-dev android-tools-adb git python3 curl wget unzip re2c

      - name: Create Missing Dependencies
        # Fix for FileNotFoundError: usr/magisk/magisk_version
        run: |
          mkdir -p usr/magisk
          echo "26.1" > usr/magisk/magisk_version
          touch usr/magisk/update_magisk.sh
          chmod +x usr/magisk/update_magisk.sh

      - name: Patch Script Logic
        # Fix for IndexError: list index out of range
        run: |
          sed -i 's/branch = run(\[.*\]).splitlines()\[1\]/branch = "cruel"/g' cruelbuild
          sed -i 's/if version:/if True:/g' cruelbuild

      - name: Compile Kernel
        run: |
          mkdir -p out
          python3 cruelbuild config \
            model=N975F \
            toolchain=proton \
            name="Cruel-Hunter-Elite-120FPS" \
            +wireguard \
            +ttl \
            +nohardening \
            +nodebug \
            +ntfs \
            +sdfat \
            +cifs \
            +morosound \
            +boeffla_wl_blocker \
            +force_dex_wqhd \
            +usb_serial \
            +empty_vbmeta \
            +performance \
            +simple_lmk \
            +tcp_bbr \
            +tcp_westwood \
            +io_zen \
            +fp_boost \
            +1000hz
          
          python3 cruelbuild mkimg model=N975F

      - name: Upload Output
        uses: actions/upload-artifact@v4
        with:
          name: Cruel-Kernel-Result
          path: out/*.zip
