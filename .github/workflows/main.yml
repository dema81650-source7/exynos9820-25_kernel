name: Build Cruel Kernel Note10+ Ultimate

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3
        with:
          ref: cruel
          fetch-depth: 0

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libncurses-dev bc bison flex libssl-dev libelf-dev android-tools-adb git python3 curl wget unzip re2c

      - name: Configure Git Identity
        run: |
          git config --global user.email "bot@github.com"
          git config --global user.name "GitHub-Actions"

      - name: Surgical Code Repair
        run: |
          # This Python script fixes the source code of cruelbuild properly
          python3 -c "
          import sys
          import re
          
          try:
              with open('cruelbuild', 'r') as f:
                  content = f.read()
              
              # 1. Fix Branch IndexError (Hardcode it)
              content = re.sub(r'branch\s*=\s*run\(\[.*?splitlines\(\)\[1\]', 'branch = \"cruel\"', content, flags=re.DOTALL)
              
              # 2. Fix NameError: version (Define it at module level)
              # We find the first import and inject version right after it
              content = content.replace('import os', 'import os\nversion = \"26.1\"')
              
              # 3. Disable Magisk functions to prevent exit status errors
              content = content.replace('update_magisk(', '# update_magisk(')
              
              with open('cruelbuild', 'w') as f:
                  f.write(content)
              print('Source code repaired successfully.')
          except Exception as e:
              print(f'Repair Failed: {e}')
              sys.exit(1)
          "

      - name: Configure and Build Kernel
        run: |
          mkdir -p out
          # Using python3 explicitly to avoid shell execution errors
          python3 cruelbuild config \
            model=N975F \
            toolchain=proton \
            name="Cruel-Hunter-Elite-120FPS" \
            +wireguard \
            +ttl \
            +nohardening \
            +nodebug \
            +ntfs \
            +sdfat \
            +cifs \
            +morosound \
            +boeffla_wl_blocker \
            +force_dex_wqhd \
            +usb_serial \
            +empty_vbmeta \
            +performance \
            +simple_lmk \
            +tcp_bbr \
            +tcp_westwood \
            +io_zen \
            +fp_boost \
            +1000hz
          
          python3 cruelbuild mkimg model=N975F

      - name: Upload Finished Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Cruel-Kernel-Note10Plus-Final
          path: out/*.zip
