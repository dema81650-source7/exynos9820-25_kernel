name: Build Cruel Kernel Note10+ Ultimate

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          ref: cruel
          fetch-depth: 0

      - name: Setup Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libncurses-dev bc bison flex libssl-dev libelf-dev android-tools-adb git python3 curl wget unzip

      - name: Patch Build Script (Fix SyntaxError)
        run: |
          # Use Python to surgically replace the problematic line
          # This avoids 'sed' issues with unmatched parentheses
          python3 -c "
          import sys
          lines = []
          try:
              with open('cruelbuild', 'r') as f:
                  for line in f:
                      # Find the line causing the issue (git branch check)
                      if 'branch =' in line and 'run([' in line:
                          # Replace it with a hardcoded string, keeping indentation
                          lines.append('    branch = \"cruel\"\n')
                      else:
                          lines.append(line)
              
              # Write the fixed file back
              with open('cruelbuild', 'w') as f:
                  f.writelines(lines)
              print('Successfully patched cruelbuild script.')
          except Exception as e:
              print(f'Error patching file: {e}')
              sys.exit(1)
          "

      - name: Fix Magisk Dependency
        run: |
          # Create dummy magisk script to prevent exit status 11
          mkdir -p usr/magisk/
          echo "#!/bin/sh" > usr/magisk/update_magisk.sh
          echo "exit 0" >> usr/magisk/update_magisk.sh
          chmod +x usr/magisk/update_magisk.sh

      - name: Configure and Build
        run: |
          chmod +x cruelbuild
          
          ./cruelbuild config \
            model=N975F \
            toolchain=proton \
            name="Cruel-Hunter-Elite-120FPS" \
            +wireguard \
            +ttl \
            +nohardening \
            +nodebug \
            +ntfs \
            +sdfat \
            +cifs \
            +morosound \
            +boeffla_wl_blocker \
            +force_dex_wqhd \
            +usb_serial \
            +empty_vbmeta \
            +performance \
            +simple_lmk \
            +tcp_bbr \
            +tcp_westwood \
            +io_zen \
            +fp_boost \
            +1000hz
          
          ./cruelbuild mkimg model=N975F

      - name: Upload Kernel
        uses: actions/upload-artifact@v4
        with:
          name: Cruel-Kernel-Note10Plus
          path: out/*.zip
