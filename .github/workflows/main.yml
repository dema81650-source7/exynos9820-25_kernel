name: Build Cruel Kernel Note10+ Ultimate

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
        with:
          ref: cruel

      - name: Setup Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libncurses-dev bc bison flex libssl-dev libelf-dev

      - name: Configure and Build
        run: |
          chmod +x cruelbuild
          ./cruelbuild config \
            model=N975F \
            name="Cruel-Hunter-Elite-120FPS" \
            +magisk \
            +wireguard \
            +ttl \
            +nohardening \
            +nodebug \
            +ntfs \
            +sdfat \
            +cifs \
            +morosound \
            +boeffla_wl_blocker \
            +force_dex_wqhd \
            +usb_serial \
            empty_vbmeta \
            performance \
            simple_lmk \
            tcp_bbr \
            tcp_westwood \
            io_zen \
            fp_boost \
            750hz
          ./cruelbuild mkimg
