name: Build Cruel Kernel Note10+ Ultimate

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3
        with:
          ref: cruel
          fetch-depth: 0

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libncurses-dev bc bison flex libssl-dev libelf-dev android-tools-adb git python3 curl wget unzip re2c

      - name: Configure Git Identity
        run: |
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "GitHub Actions"

      - name: Patch Branch Detection logic
        run: |
          # Fixing the Git branch error that caused IndexError earlier
          python3 -c "
          import sys
          import re
          lines = []
          skip_mode = False
          
          try:
              with open('cruelbuild', 'r') as f:
                  for line in f:
                      match = re.match(r'^(\s*)branch = run\(', line)
                      if match:
                          indent = match.group(1)
                          skip_mode = True
                          lines.append(f'{indent}branch = \"cruel\"\n')
                          continue
                      
                      if skip_mode:
                          if 'splitlines()[1]' in line:
                              skip_mode = False
                          continue
                      
                      lines.append(line)
              
              with open('cruelbuild', 'w') as f:
                  f.writelines(lines)
              print('Core script patched successfully.')
          except Exception as e:
              print(f'Error: {e}')
              sys.exit(1)
          "

      - name: Configure and Build Kernel
        run: |
          chmod +x cruelbuild
          mkdir -p out
          
          # Added '-magisk' to explicitly disable Magisk integration
          ./cruelbuild config \
            model=N975F \
            toolchain=proton \
            name="Cruel-Hunter-Elite-120FPS" \
            -magisk \
            +wireguard \
            +ttl \
            +nohardening \
            +nodebug \
            +ntfs \
            +sdfat \
            +cifs \
            +morosound \
            +boeffla_wl_blocker \
            +force_dex_wqhd \
            +usb_serial \
            +empty_vbmeta \
            +performance \
            +simple_lmk \
            +tcp_bbr \
            +tcp_westwood \
            +io_zen \
            +fp_boost \
            +1000hz
          
          ./cruelbuild mkimg model=N975F

      - name: Upload Finished Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Cruel-Kernel-Note10Plus-NoMagisk
          path: out/*.zip
