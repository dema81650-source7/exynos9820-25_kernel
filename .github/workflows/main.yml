name: Build Cruel Kernel Note10+ Ultimate

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3
        with:
          ref: cruel
          fetch-depth: 0

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libncurses-dev bc bison flex libssl-dev libelf-dev android-tools-adb git python3 curl wget unzip re2c

      - name: Configure Git Identity
        run: |
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "GitHub Actions"

      - name: Surgical Patch (Fixing Git and Disabling Magisk)
        run: |
          # This Python script will physically remove the Magisk calls and fix the Git error
          python3 -c "
          import sys
          import re
          lines = []
          skip_mode = False
          
          try:
              with open('cruelbuild', 'r') as f:
                  for line in f:
                      # 1. Fix the Git Branch Detection (Indentation safe)
                      if 'branch = run' in line and 'splitlines()[1]' in line:
                          indent = line[:line.find('branch')]
                          lines.append(f'{indent}branch = \"cruel\"\n')
                          skip_mode = True
                          continue
                      
                      # Stop skipping after finishing the branch logic
                      if skip_mode and 'splitlines()' in line:
                          skip_mode = False
                          continue
                      
                      if skip_mode:
                          continue

                      # 2. Disable Magisk functions by commenting them out
                      if 'update_magisk(' in line:
                          lines.append(f'# {line}') # Comment out the Magisk call
                          continue
                      
                      lines.append(line)
              
              with open('cruelbuild', 'w') as f:
                  f.writelines(lines)
              print('Successfully removed Magisk calls and fixed Git logic.')
          except Exception as e:
              print(f'Patch Error: {e}')
              sys.exit(1)
          "

      - name: Clean Environment
        run: |
          # Ensure no Magisk folders exist to confuse the script
          rm -rf usr/magisk/

      - name: Configure and Build Kernel
        run: |
          chmod +x cruelbuild
          mkdir -p out
          
          # Use standard configuration without Magisk
          ./cruelbuild config \
            model=N975F \
            toolchain=proton \
            name="Cruel-Hunter-Elite-120FPS" \
            +wireguard \
            +ttl \
            +nohardening \
            +nodebug \
            +ntfs \
            +sdfat \
            +cifs \
            +morosound \
            +boeffla_wl_blocker \
            +force_dex_wqhd \
            +usb_serial \
            +empty_vbmeta \
            +performance \
            +simple_lmk \
            +tcp_bbr \
            +tcp_westwood \
            +io_zen \
            +fp_boost \
            +1000hz
          
          ./cruelbuild mkimg model=N975F

      - name: Upload Finished Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Cruel-Kernel-Note10Plus-Final
          path: out/*.zip
