name: Build Cruel Kernel Note10+ Ultimate

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          ref: cruel
          fetch-depth: 0

      - name: Setup Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libncurses-dev bc bison flex libssl-dev libelf-dev android-tools-adb git python3 curl wget unzip
          git config --global user.email "bot@example.com"
          git config --global user.name "KernelBot"
          git checkout cruel
          
          # The Trick: Create a fake update_magisk.sh to bypass the crash
          mkdir -p usr/magisk/
          echo "#!/bin/sh" > usr/magisk/update_magisk.sh
          echo "exit 0" >> usr/magisk/update_magisk.sh
          chmod +x usr/magisk/update_magisk.sh

      - name: Configure and Build
        run: |
          chmod +x cruelbuild
          ./cruelbuild config \
            model=N975F \
            toolchain=proton \
            name="Cruel-Hunter-Elite-120FPS" \
            +wireguard \
            +ttl \
            +nohardening \
            +nodebug \
            +ntfs \
            +sdfat \
            +cifs \
            +morosound \
            +boeffla_wl_blocker \
            +force_dex_wqhd \
            +usb_serial \
            +empty_vbmeta \
            +performance \
            +simple_lmk \
            +tcp_bbr \
            +tcp_westwood \
            +io_zen \
            +fp_boost \
            +1000hz
          
          ./cruelbuild mkimg model=N975F

      - name: Upload Kernel
        uses: actions/upload-artifact@v4
        with:
          name: Cruel-Kernel-Note10Plus
          path: out/*.zip
